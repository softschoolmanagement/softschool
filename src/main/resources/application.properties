# Copy this file to application.properties (same folder, normally
# src/main/resources/application.properties) and DO NOT commit that copy —
# it's already covered by .gitignore. Every value below is read from an
# environment variable at startup; nothing here is a real secret.

# ── Database ──────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── Connection pool (HikariCP) ──────────────────────────────────────────
# FIX: the dashboard (main.js -> calculateFinancials()) fires ~14 API
# calls in parallel on every single login. With no settings here, Spring
# Boot used Hikari's default of only 10 connections total — so every
# login already asked for MORE connections than the pool could hand out,
# and the extra requests queued/waited. That queueing is what made
# dashboard data "come in 20 seconds later."
#
# 20 is comfortably above the 14-call burst, with room for another admin
# using the app at the same time, without asking more of MySQL than a
# small VPS can realistically serve.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
# How long a request will wait in the queue for a free connection before
# giving up with a clear error, instead of hanging silently.
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:15000}
# FIX: recycle connections BEFORE MySQL's own idle/wait_timeout can close
# them out from under us. If MySQL closes a connection the pool still
# thinks is open, the next query on it fails with a "connection closed /
# communications link failure" error — this is what caused data to
# randomly go missing or the dashboard to reset to 0 after sitting idle
# for a minute. Set this LOWER than your MySQL server's wait_timeout
# (check it with: SHOW VARIABLES LIKE 'wait_timeout'; — if that value is
# less than 280 (seconds), lower DB_POOL_MAX_LIFETIME_MS to match, e.g.
# a 60s wait_timeout needs this set to about 50000).
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:280000}
# Belt-and-suspenders: validate a connection is actually alive right
# before handing it out, so a connection MySQL already dropped is caught
# and replaced instead of failing the user's request.
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}

# ── Super Admin panel login (superadmin.html / AdminAuthController) ────
# ADMIN_SESSION_SECRET: long random string used to sign admin session
# tokens. Generate with: openssl rand -base64 48
# NOTE: left unset (empty default below) until you configure it, the
# admin panel simply stays disabled (fails closed) instead of crashing
# app startup — see AdminSessionService.isConfigured().
admin.session-secret=${ADMIN_SESSION_SECRET:}
# Set this only while rotating ADMIN_SESSION_SECRET (see AdminSessionService).
admin.session-secret-previous=${ADMIN_SESSION_SECRET_PREVIOUS:}
admin.session-ttl-minutes=${ADMIN_SESSION_TTL_MINUTES:60}
admin.superadmin-username=${SUPERADMIN_USERNAME:}
# Generate with: java com.softschool.backend.security.PasswordHashUtil "your-password"
admin.superadmin-password-hash=${SUPERADMIN_PASSWORD_HASH:}

# ── School operational API sessions ───────────────────────────────────
# SCHOOL_SESSION_SECRET: long random string used to sign school sessions.
# Generate with: openssl rand -base64 48
# Leave unset to fail closed: school APIs return 401 until configured.
school.session-secret=${SCHOOL_SESSION_SECRET:}
school.session-secret-previous=${SCHOOL_SESSION_SECRET_PREVIOUS:}
# NOTE: school sessions no longer expire (session limit removed) — see
# SchoolSessionService. SCHOOL_SESSION_TTL_MINUTES is no longer read; it's
# left here only so an existing .env that still sets it doesn't error out.

# ── Legacy /api/auth/login (AuthController) — leave unset to disable it ─
legacy-auth.phone=${LEGACY_AUTH_PHONE:}
legacy-auth.password-hash=${LEGACY_AUTH_PASSWORD_HASH:}

# ── CORS allowlist (comma-separated), read by WebConfig ────────────────
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# ── Biometric sync (BiometricController /api/biometric/sync) ───────────
# Shared secret the local zkteco_sync_agent.py script sends as the
# "X-Biometric-Key" header. Generate with: openssl rand -base64 32
# Leave unset to fail closed: the sync endpoint returns 503 until configured.
biometric.sync-key=${BIOMETRIC_SYNC_KEY:}

# ── Rate limiting (already env-overridable, defaults shown) ────────────
ratelimit.general.capacity=${RATELIMIT_GENERAL_CAPACITY:300}
ratelimit.general.window-seconds=${RATELIMIT_GENERAL_WINDOW_SECONDS:60}
ratelimit.auth.ip-capacity=${RATELIMIT_AUTH_IP_CAPACITY:20}
ratelimit.auth.ip-window-seconds=${RATELIMIT_AUTH_IP_WINDOW_SECONDS:60}
ratelimit.auth.identity-capacity=${RATELIMIT_AUTH_IDENTITY_CAPACITY:7}
ratelimit.auth.identity-window-seconds=${RATELIMIT_AUTH_IDENTITY_WINDOW_SECONDS:300}

spring.jpa.hibernate.ddl-auto=update

# ── HTTP response compression ─────────────────────────────────────────
# FIX: nothing here previously enabled gzip, so every API response went
# out as raw uncompressed JSON. The server is in Europe and the schools
# using it are in Asia, so every kilobyte costs real round-trip time on
# a link that already has ~150-250ms of latency. JSON is highly
# repetitive text and typically compresses by 70-85%, so this is close
# to a free 3-5x speedup on every list endpoint (students, staff,
# finance ledgers, salary records) with only a few milliseconds of CPU
# on the VPS.
#
# min-response-size skips compressing tiny responses, where the gzip
# header would cost more than it saves.
#
# NOTE: base64 image data is the one thing gzip barely helps with — it
# is already-compressed JPEG/PNG bytes re-encoded as text, so it only
# shrinks by ~10-25%. That is exactly why the photos also had to be
# moved off the JSON payload entirely (see StudentListDTO and
# StudentController#getStudentPhoto) rather than just compressed.
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=1024

# ── Open Session In View ──────────────────────────────────────────────
# FIX: Spring Boot defaults this to TRUE, which holds a database
# connection open for the ENTIRE request — including the time spent
# serialising the response to JSON and streaming it to a client on the
# other side of the world. On a small VPS with a 20-connection pool and
# a dashboard that fires a burst of parallel calls, connections end up
# pinned for hundreds of milliseconds each doing no database work at
# all, and later requests queue behind them waiting for a free one.
#
# Setting it to false returns each connection to the pool the moment the
# repository call finishes, so the pool serves far more requests per
# second from the same 20 connections.
#
# SAFE HERE because every endpoint in this project returns either a DTO
# projection or a fully-loaded entity with no lazy associations — there
# are no @OneToMany / @ManyToOne relationships anywhere in the model
# package, so there is nothing that could throw LazyInitializationException
# once the session closes early.
spring.jpa.open-in-view=false

server.port=${PORT:8080}
